data_dir: outputs/studies/depth_sweep_v2/derived/nn_dataset/emission_top_pixel_1d
checkpoint: best_depthcnn.pth
seed: 11
device: cpu
batch_size: 32
num_workers: 0
stratified_split: true
quantile_norm: true
q_low: 0.001
q_high: 0.999
aug_p: 0.25
aug_noise_min: 0.0
aug_noise_max: 0.0025
aug_max_shift: 2
aug_amp_min: 0.985
aug_amp_max: 1.015
epochs: 180
min_epochs: 40
patience: 15
lr: 0.001
weight_decay: 1.0e-05
grad_clip: 1.0
plateau_factor: 0.5
plateau_patience: 4
plateau_min_lr: 1.0e-05
huber_beta: 0.75
loss_weighting: true
num_bins: 12
weight_pow: 2.0
weight_logvar_term: true
logvar_min: -6.0
