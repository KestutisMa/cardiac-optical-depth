tta_amp_max: 1.0
attn_pool: true
heteroscedastic: true
tie_logvar_to_mu: true
depth_min_idx: 10
depth_max_idx: 80
voxel_mm: 0.05
plot_unc: both
plot_raw_samples: true
samples_alpha: 0.12
samples_jitter: 0.015
save_plot: resnet_optical.png
save_stochastic: stochastic_predictions.csv
save_stochastic_raw: null
calibrate_std_on_val: true
calibrate_std_by_depth: true
calibrate_std_monotonic: true
calib_bins: 6
calib_min_bin: 8
enable_uncertainty: true
